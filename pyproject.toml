[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pixcli"
version = "0.1.0"
description = "Local pixel art generation, editing, and animation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.8.0",
  "diffusers==0.35.2",
  "transformers==4.55.4",
  "accelerate==1.10.1",
  "huggingface-hub==0.34.4",
  "hf-xet==1.8.0",
  "safetensors==0.6.2",
  "peft==0.17.1",
  "Pillow==11.3.0",
  "typer==0.16.1",
  "psutil==7.0.0",
  "imageio[ffmpeg]==2.37.0",
  "numpy==2.2.6",
]

[dependency-groups]
dev = ["pytest==8.4.1"]

[project.scripts]
pixcli = "pixcli.cli:app"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["pixcli"]


